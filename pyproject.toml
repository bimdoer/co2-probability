[project]
name = "cost-overruns"
version = "0.1.0"
description = "Probabilistic analysis of cost overruns in construction projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "jupyter",
    "notebook",
    "pytest",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_overruns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
